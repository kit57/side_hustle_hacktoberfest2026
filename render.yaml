databases:
  - name: cartaclara-db
    plan: free

services:
  - type: web
    name: cartaclara
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: cartaclara-db
          property: connectionString
      - key: LLM_BACKEND
        value: tinker
      - key: TINKER_BASE_MODEL
        value: Qwen/Qwen3.5-4B
      # Set these in the Render dashboard; they are not stored in the repo.
      - key: TINKER_API_KEY
        sync: false
      - key: TINKER_MODEL_PATH
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: BASE_URL
        sync: false
